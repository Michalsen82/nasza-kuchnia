name: "Nasza Kuchnia — diagnostyka publikacji (jednorazowo)"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-naszakuchnia-deploy.yml'
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Odpowiedź Cloudflare Pages z różnych adresów
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from html import unescape
          import re
          urls=[
           "https://naszakuchnia.pages.dev/",
           "https://naszakuchnia.pages.dev/lasagne-alla-bolognese.html",
           "https://naszakuchnia.pages.dev/zeberka-w-miodzie.html",
           "https://naszakuchnia.pages.dev/zeberka-w-miodzie-glowne.webp"
          ]
          for url in urls:
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; RecipeDeployCheck/1.0)","Cache-Control":"no-cache"})
                  with urlopen(req,timeout=20) as resp:
                      data=resp.read(40000)
                      head=data.decode("utf-8",errors="replace")
                      title=re.search(r"<title[^>]*>(.*?)</title>",head,re.I|re.S)
                      title=unescape(re.sub("<[^>]+>","",title.group(1))) if title else "no HTML title"
                      print(f"OK {url} status={resp.status} content_type={resp.headers.get('content-type')} title={title!r} bytes_read={len(data)}",flush=True)
              except HTTPError as e:
                  print(f"HTTP {url} status={e.code}",flush=True)
              except Exception as e:
                  print(f"ERR {url} {type(e).__name__}: {str(e)[:280]}",flush=True)
          PY
