name: "Nasza Kuchnia — kontrola planera weekendowego"

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'weekend-planner.js'
      - 'weekend-planner.css'
      - 'weekend-catalog.js'
      - '.github/workflows/validate-weekend-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Składnia JS, kompletność stron i terminy weekendowe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź składnię skryptów
        run: |
          node --check weekend-planner.js
          node --check weekend-catalog.js
      - name: Sprawdź logikę dat w JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs'), vm = require('vm'), assert = require('node:assert/strict');
          const window = { addEventListener: () => {} };
          const document = {readyState: 'loading', addEventListener: () => {}};
          const context = {window, document, console, localStorage: {}};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('weekend-catalog.js', 'utf8'),context);
          vm.runInContext(fs.readFileSync('weekend-planner.js', 'utf8'),context);
          assert.ok(window.NKWeekendRecipes.length >= 15, 'Missing new carbonara recipe');
          assert.ok(window.NKWeekendRecipes.reduce((n,x)=>n+x.ingredients.length,0) >= 154, 'Missing ingredients');
          for (const id of ['golabki-pani-gosi','makaron-z-pesto','zeberka-w-miodzie','spaghetti-carbonara','schabowy-z-duszonymi-pieczarkami']) {
            assert.ok(window.NKWeekendRecipes.some(r=>r.id===id));
          }
          for (const [date,expected] of [
            ['2026-10-28','2026-10-30'],
            ['2026-10-30','2026-10-30'],
            ['2026-10-31','2026-10-30'],
            ['2026-11-01','2026-10-30'],
            ['2026-11-02','2026-11-06'],
            ['2026-12-31','2027-01-01']
          ]) {
            const d=new Date(date+'T12:00:00');
            const f=window.NKWeekend.friday(d);
            const got=f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0');
            assert.equal(got,expected,'Date '+date);
          }

          // Odrębny test przechowywania planu, liczby kropek i anulowanych posiłków.
          const db = new Map();
          const localStorage = {
            getItem: k => db.has(k) ? db.get(k) : null,
            setItem: (k,v) => db.set(k,String(v)),
            removeItem: k => db.delete(k)
          };
          const window2 = { addEventListener: () => {} };
          const document2 = { readyState: 'loading', addEventListener: () => {} };
          const ctx2 = { window:window2, document:document2, console, localStorage, confirm:()=>true, alert:()=>{} };
          vm.createContext(ctx2);
          vm.runInContext(fs.readFileSync('weekend-catalog.js', 'utf8'),ctx2);
          vm.runInContext(fs.readFileSync('weekend-planner.js', 'utf8'),ctx2);
          const planner=window2.NKWeekend;
          const day = new Date(2026,9,30,12);
          assert.equal(planner.mealCount(day),0);
          const combos = [
            ['jajecznica-z-boczkiem','sniadanie'],
            ['makaron-z-pesto','obiad'],
            ['zeberka-w-miodzie','kolacja']
          ];
          for(let i=0;i<combos.length;i++){
            assert.equal(planner.saveRecipe(combos[i][0], day, combos[i][1]), true);
            assert.equal(planner.mealCount(day), i+1);
            const cal=planner.calendarHtml(new Date(2026,9,1,12),day,true);
            const match=cal.match(/data-nk-date="2026-10-30"[^>]*>([\s\S]*?)<\/button>/);
            assert.ok(match, 'missing planned day');
            assert.equal((match[1].match(/<i><\/i>/g)||[]).length,i+1,'dots for '+(i+1)+' meals');
          }
          assert.equal(planner.cancelMeal(day,'obiad'),true);
          assert.equal(planner.isSkipped(day,'obiad'),true);
          assert.equal(planner.mealCount(day),2);
          assert.equal(planner.restoreMeal(day,'obiad'),true);
          assert.equal(planner.isSkipped(day,'obiad'),false);
          assert.equal(planner.mealCount(day),2); // restore slot, not canceled dish
          assert.equal(planner.saveRecipe('makaron-z-pesto',day,'obiad'),true);
          assert.equal(planner.mealCount(day),3);
          assert.equal(planner.cancelMeal(day,'sniadanie'),true);
          assert.equal(planner.saveRecipe('jajecznica-z-boczkiem',day,'sniadanie'),true);
          assert.equal(planner.isSkipped(day,'sniadanie'),false); // planning reopens hidden slot
          const next=planner.friday(new Date());
          const nextISO = next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0')+'-'+String(next.getDate()).padStart(2,'0');
          const nextMonth=planner.calendarHtml(new Date(next.getFullYear(),next.getMonth(),1),next,true);
          const highlight=nextMonth.match(new RegExp('<button[^>]*class="([^"]*)"[^>]*data-nk-date="'+nextISO+'"'));
          assert.ok(highlight&&highlight[1].includes('is-next-weekend'), 'nearest weekend should be pink');
          assert.ok(nextMonth.includes('is-today'), 'current date should be indicated when visible');
          console.log('Testy weekendów, trzech kropek i anulowania/przywracania posiłków OK');
          NODE
      - name: Sprawdź integrację we wszystkich podstronach
        run: |
          python3 <<'PY'
          from pathlib import Path
          pages=[p for p in Path('.').glob('*.html') if p.name not in ('menu-weekendowe.html','weekend-menu.html')]
          assert len(pages)>=16, f'Expected at least 16 pages, got {len(pages)}'
          for file in pages:
              s=file.read_text('utf8')
              assert '<a href="menu-weekendowe.html">Menu weekendowe</a>' in s, file
              assert s.count('<script src="weekend-planner.js" defer></script>')==1, file
              assert s.count('<script src="weekend-catalog.js" defer></script>')==1, file
              assert s.count('<link rel="stylesheet" href="weekend-planner.css"/>')==1, file
              assert s.count('</html>')==1, file
          for name,kind in [('menu-weekendowe.html','calendar'),('weekend-menu.html','detail')]:
              s=Path(name).read_text('utf8')
              assert f'data-nk-page="{kind}"' in s, name
              assert 'weekend-planner.js' in s, name
          assert 'nk-shopping-items' in Path('weekend-menu.html').read_text('utf8')
          # Spójność marginesów obu nowych podstron i wydruk wyłącznie zakupów.
          style=Path('weekend-planner.css').read_text('utf8')
          detail=Path('weekend-menu.html').read_text('utf8')
          script=Path('weekend-planner.js').read_text('utf8')
          assert 'body.nk-weekend-page .nk-shell{' in style
          assert 'max-width:1320px;' in style
          assert 'width:calc(100% - 48px)' in style
          assert 'body.nk-weekend-page .nk-shell{width:calc(100% - 32px)' in style
          assert '@page{size:A4;margin:15mm 15mm 16mm}' in style
          assert 'main.nk-shell > :not(#nk-shopping-section){display:none!important}' in style
          assert '#nk-shopping-section .nk-shopping-list' in style
          assert detail.count('id="nk-print-shopping-main"')==1
          assert detail.count('id="nk-print-shopping"')==1
          assert detail.count('id="nk-print-weekend-range"')==1
          assert 'function printShoppingOnly(){renderShopping();window.print();}' in script
          assert 'printRange.textContent="Weekend: "+compactWeekend(f);' in script
          print('Test szerokości obu stron oraz wydruku samej listy zakupów OK')
          assert Path('spaghetti-carbonara.html').is_file()
          content=Path('spaghetti-carbonara.html').read_text('utf8')
          assert 'id="spaghetti-carbonara"' in content
          assert content.count('class="family-step"')==6
          assert content.count('class="family-check"')==6
          homepage=Path('index.html').read_text('utf8')
          assert 'href="spaghetti-carbonara.html"' in homepage
          assert 'featured-spaghetti-carbonara' in homepage
          new=Path('schabowy-z-duszonymi-pieczarkami.html').read_text('utf8')
          assert 'id="schabowy-z-duszonymi-pieczarkami"' in new
          assert new.count('class="family-step"')==8
          assert new.count('class="family-check"')==16
          assert 'href="schabowy-z-duszonymi-pieczarkami.html"' in homepage
          assert 'featured-schabowy-z-duszonymi-pieczarkami' in homepage
          assert 'src="schabowy-z-pieczarkami-glowne.webp"' in new
          assert 'src="schabowy-z-pieczarkami-glowne.webp"' in homepage
          assert Path('schabowy-z-pieczarkami-glowne.webp').is_file(), 'Missing generated food photograph'
          print(f'Wszystkie {len(pages)} stron zintegrowane, schabowy z duszonymi pieczarkami OK.')
          PY
