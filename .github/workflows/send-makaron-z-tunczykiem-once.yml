name: "Nasza Kuchnia — jednorazowe powiadomienie o makaronie z tuńczykiem"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/send-makaron-z-tunczykiem-once.yml'

permissions:
  contents: read

jobs:
  email_existing_recipe:
    name: Standardowy e-mail o makaronie z tuńczykiem (jednorazowo)
    if: ${{ github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Pobierz aktualny przepis i szablon e-mail
        uses: actions/checkout@v4
      - name: Wyślij standardowe powiadomienie na oba adresy
        env:
          NASZA_KUCHNIA_SMTP_USER: naszakuchnia.am@gmail.com
          NASZA_KUCHNIA_SMTP_APP_PASSWORD: ${{ secrets.NASZA_KUCHNIA_SMTP_APP_PASSWORD }}
          NASZA_KUCHNIA_NOTIFY_TO: ${{ secrets.NASZA_KUCHNIA_NOTIFY_TO }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import smtplib
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from notify_new_recipes import (
              SMTP_HOST, SMTP_PORT, SITE_URL,
              title_of_recipe, recipients_from_secret, wait_for_publication, make_email
          )

          recipe = Path("makaron-z-tunczykiem.html")
          title = title_of_recipe(recipe)
          if title != "Makaron z tuńczykiem":
              raise SystemExit("Recipe title mismatch. No messages sent.")
          url = f"{SITE_URL}/{recipe.name}"
          if not wait_for_publication(url, title):
              raise SystemExit("Recipe URL not publicly available. No messages sent.")

          user = os.environ.get("NASZA_KUCHNIA_SMTP_USER", "").strip()
          password = os.environ.get("NASZA_KUCHNIA_SMTP_APP_PASSWORD", "").strip()
          raw_to = os.environ.get("NASZA_KUCHNIA_NOTIFY_TO", "")
          if not user or not password or not raw_to:
              raise SystemExit("Mail configuration missing. No messages sent.")
          recipients = recipients_from_secret(raw_to)
          with smtplib.SMTP_SSL(SMTP_HOST, SMTP_PORT, timeout=30) as smtp:
              smtp.login(user, password)
              for address in recipients:
                  message = make_email(title, url, user, address, test_mode=False)
                  smtp.send_message(message, from_addr=user, to_addrs=[address])
          print(f"Standardowe powiadomienie '{title}' wysłane do {len(recipients)} odbiorców.")
          PY
