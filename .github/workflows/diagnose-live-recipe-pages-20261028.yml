name: "Nasza Kuchnia — kontrola aktualnej publikacji"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-recipe-pages-20261028.yml'
permissions:
  contents: read
jobs:
  check_production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Porównaj rzeczywistą stronę z aktualnym kodem
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from html import unescape
          import re,time
          domain="https://naszakuchnia.pages.dev"
          paths=["/makaron-z-pesto.html","/makaron-z-pesto","/zeberka-w-miodzie.html","/zeberka-w-miodzie","/lasagne-alla-bolognese.html"]
          for attempt in range(1,4):
            print(f"=== PASS {attempt} ===",flush=True)
            for path in paths:
              for cache in ["plain","bust"]:
                url=domain+path+("?check=20261028-b537f13e-14c06e49" if cache=="bust" else "")
                try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0 NaszaKuchniaProductionCheck/1.0","Cache-Control":"no-cache, no-store"})
                  with urlopen(req,timeout=15) as resp:
                    data=resp.read(250000)
                    body=data.decode("utf-8",errors="replace")
                    title=re.search(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
                    title=unescape(title.group(1)) if title else ""
                    print(f"{path} {cache}: HTTP {resp.status} bytes={len(data)} new_header={'Dodaj przepis' in body} title={title!r} etag={resp.headers.get('etag')} cf-cache={resp.headers.get('cf-cache-status')} age={resp.headers.get('age')}",flush=True)
                except Exception as exc:
                  print(f"{path} {cache}: {type(exc).__name__} {str(exc)[:200]}",flush=True)
            if attempt<3: time.sleep(12)
          PY